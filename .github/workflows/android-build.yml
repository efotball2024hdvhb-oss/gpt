name: MindGPT Android Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "releases/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React UI dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI
        run: npm run build

      - name: Verify UI bundle
        run: |
          grep -q '"liquid-gooey"' package.json
          grep -q '"@fontsource/vazirmatn"' package.json
          ! grep -q 'thinking-orbs' package.json
          ! grep -q 'voice-glow' package.json
          ! grep -q 'metal-fx' package.json
          test -s app/src/main/assets/web/index.html
          test -n "$(find app/src/main/assets/web/assets -type f -name '*.js' -size +10k -print -quit)"
          test -n "$(find app/src/main/assets/web/assets -type f -name '*.css' -size +1k -print -quit)"
          ! grep -R -q 'هوش مصنوعی ممکن است اشتباه کند' web/src app/src/main/assets/web
          grep -q "CODECRAFT_BASE='https://codecraftapi.com/v1'" web/src/main.jsx
          grep -q 'function ModelSettings' web/src/main.jsx
          grep -q 'Get Plus' web/src/main.jsx
          ! grep -q 'model-chip' web/src/main.jsx
          ! grep -q 'API و مدل‌ها' web/src/main.jsx

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable release signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.MINDGPT_SIGNING_KEY_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64" || { echo "Missing MINDGPT_SIGNING_KEY_B64 secret"; exit 1; }
          echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/mindgpt-release.jks"

      - name: Build signed MindGPT APK
        env:
          MINDGPT_KEYSTORE_PATH: ${{ runner.temp }}/mindgpt-release.jks
          MINDGPT_KEYSTORE_PASSWORD: ${{ secrets.MINDGPT_KEYSTORE_PASSWORD }}
          MINDGPT_KEY_ALIAS: ${{ secrets.MINDGPT_KEY_ALIAS }}
          MINDGPT_KEY_PASSWORD: ${{ secrets.MINDGPT_KEY_PASSWORD }}
          CODECRAFT_API_KEY: ${{ secrets.CODECRAFT_API_KEY }}
        run: |
          test -n "$CODECRAFT_API_KEY" || { echo "Missing CODECRAFT_API_KEY secret"; exit 1; }
          gradle --no-daemon :app:assembleRelease -PCODECRAFT_API_KEY="$CODECRAFT_API_KEY"

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "MindGPT APK size: $SIZE bytes"
          ls -lh "$APK"
          test "$SIZE" -gt 21286092

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindGPT-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK in repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/MindGPT.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MindGPT.apk
          if git diff --cached --quiet; then
            echo "APK already current"
          else
            git commit -m "chore: publish MindGPT 5.3.2 signed APK [skip ci]"
            git push origin HEAD:main
          fi
